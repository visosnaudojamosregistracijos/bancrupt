<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!-- Šešėlis po kojomis -->
  <ellipse cx="100" cy="288" rx="55" ry="10" fill="rgba(0,0,0,0.35)"/>
  <ellipse cx="100" cy="288" rx="35" ry="6" fill="rgba(0,0,0,0.5)"/>

  <!-- ===== KAIRĖ KOJA ===== -->
  <g id="tevas-left-leg">
    <!-- Batas -->
    <ellipse cx="72" cy="272" rx="24" ry="13" fill="#3a1f08"/>
    <ellipse cx="72" cy="270" rx="24" ry="12" fill="#5c3610"/>
    <rect x="50" y="258" width="44" height="14" rx="5" fill="#6b4018"/>
    <!-- Batraištis -->
    <line x1="55" y1="265" x2="90" y2="265" stroke="#3a1f08" stroke-width="2"/>
    <!-- Kojinė -->
    <rect x="62" y="238" width="22" height="24" rx="4" fill="#1a1a2e"/>
    <!-- Kelnių klešnė -->
    <path d="M 60 220 L 62 240 Q 62 250 72 250 Q 82 250 82 240 L 84 220 Z" fill="#1a1a2e"/>
  </g>

  <!-- ===== DEŠINĖ KOJA ===== -->
  <g id="tevas-right-leg">
