    <path d="M 112 58 Q 122 55 130 58" fill="none" stroke="#909090" stroke-width="3" stroke-linecap="round"/>

    <!-- Akiniai -->
    <ellipse cx="82" cy="74" rx="14" ry="13" fill="rgba(200,220,255,0.15)"/>
    <ellipse cx="82" cy="74" rx="14" ry="13" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>
    <ellipse cx="118" cy="74" rx="14" ry="13" fill="rgba(200,220,255,0.15)"/>
    <ellipse cx="118" cy="74" rx="14" ry="13" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>
    <!-- Tilts -->
    <line x1="96" y1="74" x2="104" y2="74" stroke="#2a2a2a" stroke-width="2.5"/>
    <!-- Kairysis lankelis -->
