    <ellipse cx="128" cy="272" rx="24" ry="13" fill="#3a1f08"/>
    <ellipse cx="128" cy="270" rx="24" ry="12" fill="#5c3610"/>
    <rect x="106" y="258" width="44" height="14" rx="5" fill="#6b4018"/>
    <line x1="111" y1="265" x2="146" y2="265" stroke="#3a1f08" stroke-width="2"/>
    <!-- Kojinė -->
