    <rect x="150" y="210" width="30" height="22" rx="4" fill="#8B4513"/>
    <rect x="150" y="210" width="30" height="8" rx="4" fill="#A0522D"/>
    <circle cx="175" cy="221" r="3" fill="#FFD700"/>

    <!-- Kaklas -->
    <rect x="90" y="100" width="20" height="20" fill="#e8b88a"/>

    <!-- Galva -->
    <ellipse cx="100" cy="75" rx="42" ry="45" fill="#e8b88a"/>

    <!-- Ausys -->
    <ellipse cx="58" cy="75" rx="8" ry="12" fill="#d4a574"/>
    <ellipse cx="142" cy="75" rx="8" ry="12" fill="#d4a574"/>

    <!-- Plaukai (ryži, reti) -->
    <path d="M 58 55 Q 60 30 100 25 Q 140 30 142 55 Q 140 40 100 38 Q 60 40 58 55 Z" fill="#c0c0c0"/>
    <path d="M 65 45 Q 70 35 100 32 Q 130 35 135 45" fill="none" stroke="#a0a0a0" stroke-width="2"/>

    <!-- Antakiai -->
    <rect x="72" y="60" width="22" height="5" rx="2" fill="#a0a0a0"/>
    <rect x="106" y="60" width="22" height="5" rx="2" fill="#a0a0a0"/>

    <!-- Akiniai -->
    <circle cx="83" cy="75" r="14" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="117" cy="75" r="14" fill="none" stroke="#333" stroke-width="3"/>
    <line x1="97" y1="75" x2="103" y2="75" stroke="#333" stroke-width="3"/>
    <line x1="69" y1="73" x2="58" y2="70" stroke="#333" stroke-width="3"/>
    <line x1="131" y1="73" x2="142" y2="70" stroke="#333" stroke-width="3"/>

    <!-- Akys -->
    <circle cx="83" cy="76" r="4" fill="#1a1a2e"/>
    <circle cx="117" cy="76" r="4" fill="#1a1a2e"/>

    <!-- Nosis -->
    <ellipse cx="100" cy="90" rx="8" ry="6" fill="#d4a574"/>

