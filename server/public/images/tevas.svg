        <stop offset="0%" stop-color="#3a3a7a"/>
        <stop offset="100%" stop-color="#1e1e4a"/>
      </linearGradient>
      <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f0c896"/>
        <stop offset="100%" stop-color="#d4a574"/>
      </linearGradient>
      <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#d8d8d8"/>
        <stop offset="100%" stop-color="#a0a0a0"/>
      </linearGradient>
      <radialGradient id="bellyGrad" cx="50%" cy="40%">
        <stop offset="0%" stop-color="#3a3a7a"/>
        <stop offset="100%" stop-color="#1e1e4a"/>
      </radialGradient>
    </defs>

    <!-- Pilvas -->
    <ellipse cx="100" cy="192" rx="58" ry="48" fill="url(#bellyGrad)"/>
    <ellipse cx="100" cy="192" rx="58" ry="48" fill="none" stroke="#0f0f2e" stroke-width="2"/>

    <!-- Švarko liemuo -->
    <path d="M 45 150 Q 45 118 72 112 L 128 112 Q 155 118 155 150 L 155 200 Q 155 232 100 232 Q 45 232 45 200 Z" fill="url(#jacketGrad)"/>
    <path d="M 45 150 Q 45 118 72 112 L 128 112 Q 155 118 155 150 L 155 200 Q 155 232 100 232 Q 45 232 45 200 Z" fill="none" stroke="#0f0f2e" stroke-width="2.5"/>

    <!-- Marškiniai (balti) su šešėliu -->
    <path d="M 82 112 L 100 148 L 118 112 Z" fill="#f5f5f5"/>
    <path d="M 82 112 L 100 148 L 100 115 Z" fill="#e0e0e0"/>

    <!-- Kaklaraištis su mazgu -->
    <path d="M 100 148 L 93 165 L 100 210 L 107 165 Z" fill="#c0392b"/>
    <path d="M 100 148 L 96 155 L 100 165 L 104 155 Z" fill="#a02818"/>
    <path d="M 100 148 L 93 165 L 100 210 L 107 165 Z" fill="none" stroke="#7a1a10" stroke-width="1"/>

    <!-- Švarko atvartai su šešėliu -->
    <path d="M 72 112 L 88 148 L 78 195 L 58 152 Z" fill="#2a2a5e"/>
    <path d="M 72 112 L 88 148 L 78 195 L 58 152 Z" fill="none" stroke="#0f0f2e" stroke-width="1.5"/>
    <path d="M 128 112 L 112 148 L 122 195 L 142 152 Z" fill="#2a2a5e"/>
    <path d="M 128 112 L 112 148 L 122 195 L 142 152 Z" fill="none" stroke="#0f0f2e" stroke-width="1.5"/>

    <!-- Kišenė -->
    <path d="M 130 180 L 145 180 L 145 195 L 138 200 L 130 195 Z" fill="none" stroke="#0f0f2e" stroke-width="1.5"/>
    <path d="M 130 180 L 145 180" stroke="#FFD700" stroke-width="0.5"/>

    <!-- Sagos -->
    <circle cx="100" cy="175" r="3.5" fill="#FFD700"/>
    <circle cx="100" cy="175" r="2" fill="#c9a84c"/>
    <circle cx="100" cy="195" r="3.5" fill="#FFD700"/>
    <circle cx="100" cy="195" r="2" fill="#c9a84c"/>
    <circle cx="100" cy="215" r="3.5" fill="#FFD700"/>
    <circle cx="100" cy="215" r="2" fill="#c9a84c"/>

    <!-- Kairė ranka (sulenkta) -->
    <path d="M 42 145 Q 28 150 25 175 Q 22 200 35 218 Q 42 222 45 215 Q 48 200 42 180 Z" fill="#2a2a5e"/>
    <path d="M 42 145 Q 28 150 25 175 Q 22 200 35 218 Q 42 222 45 215 Q 48 200 42 180 Z" fill="none" stroke="#0f0f2e" stroke-width="1.5"/>
    <!-- Delnas -->
    <ellipse cx="38" cy="220" rx="12" ry="10" fill="url(#skinGrad)"/>
    <ellipse cx="38" cy="220" rx="12" ry="10" fill="none" stroke="#a07850" stroke-width="1"/>

    <!-- Dešinė ranka su pinigine -->
    <path d="M 158 145 Q 172 150 175 175 Q 178 200 165 218 Q 158 222 155 215 Q 152 200 158 180 Z" fill="#2a2a5e"/>
    <path d="M 158 145 Q 172 150 175 175 Q 178 200 165 218 Q 158 222 155 215 Q 152 200 158 180 Z" fill="none" stroke="#0f0f2e" stroke-width="1.5"/>
    <!-- Delnas -->
    <ellipse cx="162" cy="220" rx="12" ry="10" fill="url(#skinGrad)"/>
    <ellipse cx="162" cy="220" rx="12" ry="10" fill="none" stroke="#a07850" stroke-width="1"/>

    <!-- Piniginė -->
    <rect x="152" y="212" width="28" height="20" rx="4" fill="#8B4513"/>
    <rect x="152" y="212" width="28" height="7" rx="4" fill="#A0522D"/>
    <circle cx="175" cy="222" r="2.5" fill="#FFD700"/>
    <circle cx="175" cy="222" r="1" fill="#c9a84c"/>
