    <!-- Dešinysis lankelis -->
    <path d="M 132 72 Q 140 68 144 68" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>

    <!-- Akys su blizgesiu -->
    <ellipse cx="82" cy="75" rx="3.5" ry="4" fill="#1a1a2e"/>
    <ellipse cx="118" cy="75" rx="3.5" ry="4" fill="#1a1a2e"/>
    <circle cx="81" cy="73.5" r="1.2" fill="white"/>
    <circle cx="117" cy="73.5" r="1.2" fill="white"/>

    <!-- Nosis (natūralesnė) -->
    <path d="M 100 82 Q 96 92 100 95 Q 104 92 100 82" fill="#d4a574" opacity="0.7"/>
    <ellipse cx="100" cy="95" rx="5" ry="3" fill="#c49464"/>
    <ellipse cx="100" cy="95" rx="5" ry="3" fill="none" stroke="#a07850" stroke-width="0.8"/>
    <!-- Šnervės -->
    <circle cx="98" cy="95" r="1" fill="#8a5c30"/>
    <circle cx="102" cy="95" r="1" fill="#8a5c30"/>

    <!-- Barzda (natūralesnė) -->
    <path d="M 62 92 Q 66 128 100 138 Q 134 128 138 92 Q 132 108 100 112 Q 68 108 62 92 Z" fill="url(#hairGrad)"/>
    <path d="M 62 92 Q 66 128 100 138 Q 134 128 138 92 Q 132 108 100 112 Q 68 108 62 92 Z" fill="none" stroke="#808080" stroke-width="1"/>
    <!-- Barzdos šešėliai -->
    <path d="M 75 100 Q 80 115 100 122" fill="none" stroke="#909090" stroke-width="1" opacity="0.6"/>
    <path d="M 125 100 Q 120 115 100 122" fill="none" stroke="#909090" stroke-width="1" opacity="0.6"/>
    <!-- Ūsai -->
    <path d="M 88 100 Q 100 105 112 100" fill="none" stroke="#b0b0b0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Burna (šypsena su dantimis) -->
    <path d="M 88 108 Q 100 118 112 108" fill="none" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
    <path d="M 92 110 Q 100 115 108 110" fill="white" opacity="0.8"/>
    <path d="M 88 108 Q 100 118 112 108 Z" fill="#5a2a10" opacity="0.3"/>
  </g>
