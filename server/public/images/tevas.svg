    <path d="M 70 100 Q 75 125 100 128 Q 125 125 130 100" fill="none" stroke="#a0a0a0" stroke-width="1.5"/>

    <!-- Burna (šypsena) -->
    <path d="M 88 108 Q 100 115 112 108" fill="none" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
