    <rect x="155" y="208" width="18" height="6" rx="1" fill="none" stroke="#4a7a20" stroke-width="0.5" transform="rotate(-15 164 211)"/>

    <!-- Kaklas -->
    <path d="M 88 100 L 88 118 Q 100 122 112 118 L 112 100 Z" fill="url(#skinGrad)"/>
    <path d="M 88 100 L 88 118 Q 100 122 112 118 L 112 100 Z" fill="none" stroke="#a07850" stroke-width="1"/>
    <!-- Šešėlis po smakru -->
    <ellipse cx="100" cy="115" rx="10" ry="3" fill="rgba(0,0,0,0.15)"/>

    <!-- Galva -->
    <ellipse cx="100" cy="72" rx="45" ry="48" fill="url(#skinGrad)"/>
    <ellipse cx="100" cy="72" rx="45" ry="48" fill="none" stroke="#a07850" stroke-width="1"/>

    <!-- Ausys -->
    <ellipse cx="56" cy="72" rx="8" ry="13" fill="#e0b888"/>
    <ellipse cx="56" cy="72" rx="8" ry="13" fill="none" stroke="#a07850" stroke-width="1"/>
    <path d="M 53 70 Q 56 72 53 75" fill="none" stroke="#a07850" stroke-width="1"/>
    <ellipse cx="144" cy="72" rx="8" ry="13" fill="#e0b888"/>
    <ellipse cx="144" cy="72" rx="8" ry="13" fill="none" stroke="#a07850" stroke-width="1"/>
    <path d="M 147 70 Q 144 72 147 75" fill="none" stroke="#a07850" stroke-width="1"/>

    <!-- Plaukai (natūralesni) -->
    <path d="M 56 55 Q 55 25 100 22 Q 145 25 144 55 Q 142 42 130 38 Q 115 32 100 34 Q 85 32 70 38 Q 58 42 56 55 Z" fill="url(#hairGrad)"/>
    <path d="M 56 55 Q 55 25 100 22 Q 145 25 144 55 Q 142 42 130 38 Q 115 32 100 34 Q 85 32 70 38 Q 58 42 56 55 Z" fill="none" stroke="#808080" stroke-width="1"/>
